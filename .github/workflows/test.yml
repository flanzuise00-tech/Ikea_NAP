name: IKEA Napoli Monitor

on:
   workflow_dispatch: # Permette l'avvio manuale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run monitor script
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Scarica i cambiamenti remoti per evitare conflitti (Fetch + Rebase)
          git pull origin main --rebase
          
          git add prodotti_visti.csv
          
          # Commit solo se il CSV è cambiato
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nessun nuovo prodotto da salvare."
          else
            git commit -m "Aggiornato storico prodotti [skip ci]"
            git push origin main
          fi
