name: IKEA Napoli Monitor
on: 
  workflow_dispatch:
  schedule:
    # Esegue ogni sera alle 22:00 italiane (20:00 UTC)
    - cron: '0 20 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Obbligatorio per permettere al bot di salvare il CSV nel repo
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installazione Playwright e dipendenze
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Esecuzione Scraper
        run: python bot.py

      - name: Sincronizzazione Database CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add prodotti_visti.csv || echo "File non ancora creato"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento prodotti visti" && git push)
