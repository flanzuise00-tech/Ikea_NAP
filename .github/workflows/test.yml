name: Test IKEA Playwright
on: 
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installa Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Esegui lo script
        run: python bot.py

      - name: Salva i dati nel repository
        run: |
          git config --global user.name 'IKEA Bot'
          git config --global user.email 'bot@ikea.it'
          git add prodotti_visti.csv || echo "Nessun nuovo file"
          git commit -m "Aggiornamento prodotti visti" || echo "Niente di nuovo da committare"
          git push

      - name: Carica Screenshot in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
