name: IKEA Napoli Monitor

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run monitor script
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Assicura l'esistenza del file
          touch prodotti_visti.csv
          git add prodotti_visti.csv
          
          if git diff --staged --quiet; then
            echo "Nessun nuovo prodotto."
          else
            git commit -m "Aggiornato storico [skip ci]"
            # Pull per sincronizzare eventuali modifiche remote (es. se hai pulito il CSV a mano)
            git pull origin main --rebase
            git push origin main
          fi
