name: IKEA Napoli Monitor
on: 
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          # Il setup-python moderno ha il caching integrato per pip
          cache: 'pip' 

      - name: Installazione librerie Python
        run: |
          pip install playwright requests

      # --- SISTEMA DI CACHE PER I BROWSER PLAYWRIGHT ---
      - name: Cache dei Browser Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bot.py') }} # Usa il file bot.py come chiave
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Installazione Browser Playwright (solo se necessario)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Installazione dipendenze di sistema (obbligatorie)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      # --------------------------------------------------

      - name: Esecuzione Scraper
        run: python bot.py

      - name: Sincronizzazione Database CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add prodotti_visti.csv || echo "Nulla da aggiungere"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento prodotti visti" && git push)
