name: IKEA Napoli Monitor

on:
  workflow_dispatch: # Avvio manuale da scheda Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run monitor script
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aggiungiamo il file modificato allo stage
          git add prodotti_visti.csv
          
          # Controlliamo se ci sono effettivamente nuovi prodotti (commit locale)
          if git diff --staged --quiet; then
            echo "Nessun nuovo prodotto rilevato."
          else
            git commit -m "Aggiornato storico prodotti [skip ci]"
            
            # Sincronizziamo con il server: scarichiamo i cambiamenti e mettiamo i nostri sopra
            # Usiamo -X ours per dare la precedenza ai dati appena scaricati dal bot in caso di conflitti
            git pull origin main --rebase -X ours
            
            # Invio finale
            git push origin main
          fi
