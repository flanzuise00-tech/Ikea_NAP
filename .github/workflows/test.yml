name: Ikea Napoli Bot Scan

on:
  schedule:
    # Esegue il bot ogni 30 minuti
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Permette di avviarlo manualmente dal tasto "Run workflow"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Installa i file necessari per far girare il browser Playwright
          playwright install chromium --with-deps

      - name: Run Bot Scan
        env:
          # Se preferisci non scrivere i token nel codice, puoi usarli come "Secrets"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Aggiunge il file CSV aggiornato per non reinviare gli stessi prodotti
          git add prodotti_visti.csv
          # Esegue il commit solo se ci sono nuovi prodotti
          git commit -m "Aggiornato storico prodotti" || echo "Nessun nuovo prodotto trovato."
          git push
