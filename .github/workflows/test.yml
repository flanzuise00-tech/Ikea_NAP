name: Test IKEA Playwright
on: 
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installa Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Esegui lo script
        run: python test_ikea_playwright.py

      - name: Carica Screenshot in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
